# Pulls the club rating (and the month's winner), plus podium and upcoming-tournament data, from iMafia / MafGame every day.
# If anything changed and the site still builds, it commits to main and Vercel redeploys.
name: Sync club data

on:
  schedule:
    - cron: "0 5 * * *" # every day, 07:00 Warsaw summer time / 06:00 winter time
    # Again after the evening's games (00:30 Warsaw winter time / 01:30 summer), so the morning shows last night.
    # Rating only: the heavy profile pages stay once a day.
    - cron: "30 23 * * *"
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync-rating
      # A few iMafia profiles per day (roles, prize places, guests' avatars): docs/decisions/0005-profile-sync.md
      - run: npm run sync-profiles
        if: github.event.schedule != '30 23 * * *'
      # Round photos for the rating table, for anyone new.
      - run: npm run thumbs
      - run: npm run sync-podium
      # Upcoming tournaments with club members in them. Optional: the script keeps the previous file and exits 0
      # when a site cannot be read, and continue-on-error makes sure even a crash never stops the rating sync.
      - run: npm run sync-tournaments
        continue-on-error: true
      # Never publish data that breaks the site.
      - run: npm run build
      - name: Commit changes
        run: |
          git add -A src/data public/winners public/players public/thumbs
          if git diff --cached --quiet; then
            echo "Data unchanged, nothing to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync rating, winners, podium and tournaments from iMafia / MafGame"
          git push
