<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Page-specific tags (title, description, canonical, hreflang, Open Graph) are written for every page
         by scripts/build.mjs from src/meta.ts, between these markers. The ones here are only for `npm run dev`. -->
    <!--head-start-->
    <title>Mirage Mafia Club — спортивная мафия в Варшаве</title>
    <meta data-head name="description" content="Mirage Mafia Club — клуб спортивной мафии в Варшаве." />
    <!--head-end-->
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Tells the CSS that JavaScript runs, so entrance animations may hide content until it scrolls into view.
         Without JS (or for crawlers that skip it) everything stays visible. -->
    <script>document.documentElement.classList.add("js")</script>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Golos+Text:wght@400;500;600;700&family=Caveat:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
